services:
  postgres:
    image: postgres:16-alpine
    container_name: bunpo_wizard_db
    environment:
      POSTGRES_USER: morgan
      POSTGRES_PASSWORD: bunpo_wizard_password
      POSTGRES_DB: bunpo_wizard_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
